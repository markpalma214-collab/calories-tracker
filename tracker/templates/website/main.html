<!DOCTYPE html>
<html>
<head>
    <title> Calories Tracker <3 </title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd1e8 100%);
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
        }

        nav {
            background: #ffffff;
            border-bottom: 4px solid #ff8fb3;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 12px rgba(255, 105, 150, 0.2);
        }

        .kitty-brand {
            color: #ff5c8d;
            font-weight: bold;
            font-size: 20px;
            margin-right: auto;
            text-shadow: 1px 1px 0px #ffd1e0;
        }

        nav a {
            text-decoration: none;
            color: #d1477a;
            font-weight: bold;
            font-size: 14px;
            background: #ffeaf3;
            border: 2px solid #ffb6d1;
            padding: 8px 18px;
            border-radius: 18px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            background: #ff8fb3;
            color: #fff;
            transform: scale(1.04);
        }
    </style>
</head>
<body>
    {% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
    <nav>
        <span class="kitty-brand">🎀🍓 Calories Tracker for all girlies out there <3 </span>
        <a href="{% url 'home' %}">🏠 Home</a>
         <form method="GET">

    <input
        type="text"
        name="q"
        placeholder="Search food name"
        value="{{ request.GET.q }}"
    >
    <button type="submit">Search</button>
</form>
{% if request.user.is_authenticated %}
<a href="{% url 'logout' %}">Log out</a>
{% else %}
<a href="{% url 'authentication' %}">Login</a>
{%endif %}
    </nav>


   

    {% block content %}
    {% endblock %}

</body>
</html>
