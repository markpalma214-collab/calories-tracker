{% extends 'website/main.html' %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #ffe6f0 0%, #ffd1e8 100%);
        font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    }

    .kitty-form-container {
        max-width: 450px;
        margin: 60px auto;
        background: #ffffff;
        border: 4px solid #ff8fb3;
        border-radius: 30px;
        padding: 35px 30px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(255, 105, 150, 0.35);
        position: relative;
    }

    .kitty-form-container::before {
        content: "🎀";
        font-size: 40px;
        position: absolute;
        top: -25px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        padding: 0 10px;
    }

    .kitty-form-title {
        color: #ff5c8d;
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 25px;
        text-shadow: 1px 1px 0px #ffd1e0;
    }

    /* Style the Django form fields */
    .kitty-form-container form p {
        text-align: left;
        margin-bottom: 18px;
    }

    .kitty-form-container form label {
        display: block;
        color: #d1477a;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 6px;
    }

    .kitty-form-container form input,
    .kitty-form-container form select,
    .kitty-form-container form textarea {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid #ffb6d1;
        border-radius: 15px;
        background: #fff5f9;
        color: #7a3b52;
        font-size: 14px;
        box-sizing: border-box;
        transition: all 0.2s ease;
    }

    .kitty-form-container form input:focus,
    .kitty-form-container form select:focus,
    .kitty-form-container form textarea:focus {
        outline: none;
        border-color: #ff5c8d;
        box-shadow: 0 0 8px rgba(255, 92, 141, 0.4);
    }

    .kitty-submit-btn {
        display: inline-block;
        margin-top: 10px;
        background: #ff8fb3;
        color: #fff;
        font-weight: bold;
        font-size: 16px;
        padding: 12px 30px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.25s ease;
    }

    .kitty-submit-btn:hover {
        background: #ff5c8d;
        transform: scale(1.03);
        box-shadow: 0 6px 15px rgba(255, 105, 150, 0.4);
    }

    .kitty-form-footer {
        margin-top: 20px;
        font-size: 12px;
        color: #d18aa5;
    }
</style>

<div class="kitty-form-container">
    <div class="kitty-form-title">🐱 Log Your Calories</div>

    <form method="POST" action="">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="kitty-submit-btn">🍓 Submit</button>
        <button type="submit" class="kitty-submit-btn">🍓 Delete</button>

    </form>

    <div class="kitty-form-footer">every bite counts, cutie ♡</div>
</div>

{% endblock %}
