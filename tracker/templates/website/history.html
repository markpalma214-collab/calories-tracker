{% extends 'website/main.html' %}

{% block content %}

<form method="GET">
    <input type="date" name="calendar">
    <button type="submit">History Button</button>
</form>
<h1>date: {{ history }}</h1>
{% for subject in foods %}
<div>
    <h1>food: {{subject.food}}</h1>
    <h1>calories: {{subject.calories}} </h1>
    <h1>protein: {{subject.protein}} </h1>

</div>

{% endfor %}
{% endblock %}
